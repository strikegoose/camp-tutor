# 种子术语词典 v3(2026-08-27 创始人拍板:业务惯用写法为 canonical,取代 v2 正字优先口径)
# 总原则:canonical = 业务惯用写法;𬌗(U+2C317,牙+合)=咬合正字,列入 variants/note 备查——
#   CJK Ext F 生僻字,手机端有豆腐块渲染风险,清洗稿与全部下游产物不得出现;
# 「颌」(页+合)=颌骨/髁突概念,与 合/𬌗 是两回事(颌学=Gnathology、颌位=下颌骨位置)。
# canonical = 权威写法;variants = 已确认的代称/ASR 误写/正字;代码零硬编码,全部落本文件
version: seed-v3-2026-08-27
terms:
  # --- 词族:学科 ---
  - {canonical: 合学, variants: [和学, 核学, 𬌗学], category: 学科, note: 𬌗学=正字备查;「颌学」不是它的变体}
  - {canonical: 颌学, variants: [], category: 学科, note: Gnathology 另一学科;独立 canonical,不自动替换}
  - {canonical: 功能合学, variants: [功能颌学, 功能𬌗学], category: 学科, note: 功能𬌗学=正字备查}
