# 数字与单位专项校验规则(正则,代码通用)
number_unit_rules:
  - {pattern: '(\d+(?:\.\d+)?)\s*个?月', unit: 月, context: 疗程/年龄}
  - {pattern: '(\d+(?:\.\d+)?)\s*mm|(\d+(?:\.\d+)?)\s*毫米', unit: mm, context: 距离}
  - {pattern: '(\d+(?:\.\d+)?)\s*度', unit: 度, context: 角度}
  - {pattern: '(\d+(?:\.\d+)?)\s*岁', unit: 岁, context: 年龄}
