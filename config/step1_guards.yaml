# 部件1(术语纠错)替换守卫(config 数据;保护合法词不被变体规则误伤,代码零硬编码)
# block_prev: 变体前一字命中时不替换(该处视为合法词,自检同口径统计)
version: step1-guards-v3-2026-08-27
guards:
  - {variant: 整肌, block_prev: [调], note: 保护「调整肌肉训练/调整肌功能训练」(调整+肌…)不被 整肌→正畸 误伤;实证 C1-04/06、C2-13、C1-20 五处}
  - {variant: 畸功能训练, block_prev: [正], note: 保护「正畸功能训练」不被「畸功能训练→肌功能训练」子串误伤(与 正肌→正畸 形成乒乓)}
  - {variant: 合学, block_prev: [简], note: v3 起 合学 为 canonical,本守卫不再命中任何规则,保留备查(v2 时保护「至简合学」)}
  - {variant: 合平面, block_prev: [咬], note: 保护「咬合平面」同义词条;「上/下颌合平面」替换为 颌平面(v3 拍板业务惯用)}
  - {variant: 和学, block_prev: [究], note: 保护「研究和学习」等合法搭配}
  - {variant: 下合, block_next: [学], note: 保护「X一下/合学」断句(如「回顾一下合学」),防与「𬌗学→合学」变体规则断句混淆}
  - {variant: 下和, block_next: [学], note: 同理保护「X一下/和学」断句}
# 「一/二/三类」变体只在安氏分类语境替换为罗马数字;
# 训练营框架的「第一类问题/三类主诉」等序数用法不属于安氏分类,不替换
class_variant_rule:
  pattern: '^[一二三123]类$'
  allow_prev: [偏, 氏]
  allow_follow_head: '骨高低均磨关咬错深分畸生面'
  note: 前字为偏/氏,或后接(可隔「的/之」)分类语境字首时替换;其余保留并计入守卫跳过
